# Defines the two-instance synchronous PostgreSQL availability cluster.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mill-postgres
  namespace: mill-database
  labels:
    app.kubernetes.io/name: mill-postgres
    app.kubernetes.io/part-of: mill
spec:
  instances: 2
  failoverDelay: 5
  stopDelay: 30
  smartShutdownTimeout: 15
  switchoverDelay: 30
  bootstrap:
    initdb:
      database: mill
      owner: mill
      secret:
        name: mill-database-credentials
  storage:
    storageClass: local-path
    size: 1Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
